name: perfume
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.8
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  cloud_functions: any
  provider: any
  pinput: any
  flutter_blue_plus: ^1.32.0
  animations: ^2.0.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.0
  animated_text_kit: ^4.2.2
  glass_kit: ^4.0.2
  flutter_native_splash: ^2.3.0
  flutter_launcher_icons: ^0.13.1
  simple_gradient_text: ^1.1.0
  flutter_swipe_action_cell: ^3.1.3
  card_swiper: ^3.0.1
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.0
  clipboard: ^0.1.3
  excel: ^4.0.0
  file_picker: ^8.0.0
  http: ^1.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  pdf: ^3.10.0
  printing: ^5.11.0
  share_plus: ^7.2.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.1
  dio: ^5.7.0
  open_file: ^3.5.10
  package_info_plus: ^8.1.2
  permission_handler: ^11.3.1
  freezed_annotation: any
  json_annotation: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  fake_cloud_firestore: ^3.1.0
  freezed: any
  json_serializable: any
flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
  assets:
    - assets/animations/
    - assets/image/
    - assets/images/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/image/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/image/logo.png"
    background_color: "#0B1026"
    theme_color: "#D4AF37"
  windows:
    generate: true
    image_path: "assets/image/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/image/logo.png"
